# ===================================================================
# TEST CONFIGURATION
# ===================================================================
# Use H2 in-memory database for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Disable Flyway for tests (we'll use JPA ddl-auto)
spring.flyway.enabled=false

# Use H2 dialect for tests
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Create/drop schema for each test
spring.jpa.hibernate.ddl-auto=create-drop

# Show SQL for debugging tests
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===================================================================
# ACTUATOR TEST CONFIGURATION
# ===================================================================
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized
management.endpoint.health.roles=ROLE_ADMIN
management.endpoint.health.probes.enabled=true
management.endpoint.info.enabled=true
management.endpoint.metrics.enabled=true
stripe.webhook-secret=test_secret
ai.gemini.key=test_key

stripe.api-key=test_key

stripe.price-id.monthly=price_monthly_test
stripe.price-id.yearly=price_yearly_test
