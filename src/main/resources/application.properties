# ===================================================================
# CORE APPLICATION PROPERTIES
# ===================================================================
# Đặt tên cho ứng dụng, hữu ích cho logging và monitoring
spring.application.name=backend

# Cấu hình cổng server chạy. Mặc định là 8080.
server.port=8088

# ===================================================================
# DATABASE CONFIGURATION (PostgreSQL)
# ===================================================================
# URL kết nối đến PostgreSQL. Cấu trúc: jdbc:postgresql://<host>:<port>/<database_name>
spring.datasource.url=jdbc:postgresql://localhost:5432/lexia

# Username và Password để kết nối database
spring.datasource.username=postgres
spring.datasource.password=1234

# Driver class cho PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# JPA & HIBERNATE CONFIGURATION
# ===================================================================
# Bật tính năng tự động tạo/cập nhật schema database từ các Entity class.
# - `validate`: Chỉ kiểm tra xem schema có khớp với entity không, không thay đổi gì. (An toàn cho production)
# - `update`: Tự động cập nhật schema (thêm cột, bảng). (Tiện lợi cho development)
# - `create`: Xóa và tạo lại schema mỗi khi khởi động. (Hữu ích khi test)
# - `create-drop`: Như `create`, nhưng sẽ xóa schema khi tắt ứng dụng.
# - `none`: Không làm gì cả.
spring.jpa.hibernate.ddl-auto=update

# Hiển thị các câu lệnh SQL mà Hibernate thực thi ra console. Rất hữu ích để debug.
# spring.jpa.show-sql=true

# Định dạng các câu lệnh SQL hiển thị ra cho dễ đọc.
spring.jpa.properties.hibernate.format_sql=true

# Cấu hình "dialect" để Hibernate biết cách giao tiếp với PostgreSQL một cách tối ưu.
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ===================================================================
# JWT (JSON WEB TOKEN) SECURITY CONFIGURATION
# ===================================================================
# Đây là "chìa khóa bí mật" để ký (sign) JWT.
# QUAN TRỌNG: Giá trị này phải cực kỳ bí mật và phức tạp. Trong production, hãy dùng biến môi trường.
# Bạn có thể tạo một chuỗi ngẫu nhiên dài (ví dụ: base64 encoded).
# app.jwt.secret=<your_super_secret_jwt_key_that_is_very_long_and_random>

# Thời gian sống của Access Token (tính bằng mili giây).
# Ví dụ: 15 phút = 15 * 60 * 1000 = 900000
# app.jwt.access-token-expiration-ms=900000

# Thời gian sống của Refresh Token (tính bằng mili giây).
# Ví dụ: 7 ngày = 7 * 24 * 60 * 60 * 1000 = 604800000
# app.jwt.refresh-token-expiration-ms=604800000

# ===================================================================
# EXTERNAL API CONFIGURATION (Google Gemini)
# ===================================================================
# API Key để gọi đến Google Gemini.
# QUAN TRỌNG: Luôn dùng biến môi trường trong production.
# gemini.api.key=<your_google_gemini_api_key>

# URL của Gemini API endpoint
# gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent

# ===================================================================
# FILE UPLOAD CONFIGURATION (Optional, for avatars, etc.)
# ===================================================================
# Cấu hình giới hạn kích thước file tải lên.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Thư mục để lưu file tải lên (trong development).
# Trong production, bạn nên dùng các dịch vụ lưu trữ đám mây như AWS S3.
# file.upload-dir=./uploads

# ===================================================================
# LOGGING CONFIGURATION
# ===================================================================
# Cấu hình cấp độ log cho các package cụ thể.
# Ví dụ: Hiển thị log DEBUG cho package của ứng dụng bạn.
logging.level.com.lingosphere.api=DEBUG

# Hiển thị log WARN cho Hibernate để tránh spam console.
logging.level.org.hibernate=WARN