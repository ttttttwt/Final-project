# ===================================================================
# CORE APPLICATION PROPERTIES
# ===================================================================
# Đặt tên cho ứng dụng, hữu ích cho logging và monitoring
spring.application.name=backend

# Cấu hình cổng server chạy. Mặc định là 8080.
server.port=8088

# ===================================================================
# ENCODING CONFIGURATION
# ===================================================================
# Force UTF-8 encoding for all request/response handling
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
server.servlet.encoding.force-request=true
server.servlet.encoding.force-response=true

# Log file encoding
logging.charset.console=UTF-8
logging.charset.file=UTF-8

# ===================================================================
# JACKSON CONFIGURATION
# ===================================================================
spring.jackson.serialization.write-dates-as-timestamps=false

# ===================================================================
# DATABASE CONFIGURATION (PostgreSQL)
# ===================================================================
# URL kết nối đến PostgreSQL. Cấu trúc: jdbc:postgresql://<host>:<port>/<database_name>
spring.datasource.url=jdbc:postgresql://localhost:5432/lexia

# Username và Password để kết nối database
spring.datasource.username=postgres
spring.datasource.password=1234

# Driver class cho PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# JPA & HIBERNATE CONFIGURATION
# ===================================================================
# Tắt auto DDL vì đang dùng Flyway để quản lý schema.
# - `validate`: Chỉ kiểm tra xem schema có khớp với entity không, không thay đổi gì. (An toàn cho production)
# - `update`: Tự động cập nhật schema (thêm cột, bảng). (Tiện lợi cho development)
# - `create`: Xóa và tạo lại schema mỗi khi khởi động. (Hữu ích khi test)
# - `create-drop`: Như `create`, nhưng sẽ xóa schema khi tắt ứng dụng.
# - `none`: Không làm gì cả (Khuyên dùng khi có Flyway).
spring.jpa.hibernate.ddl-auto=none

# Hiển thị các câu lệnh SQL mà Hibernate thực thi ra console. Rất hữu ích để debug.
# spring.jpa.show-sql=true

# Định dạng các câu lệnh SQL hiển thị ra cho dễ đọc.
spring.jpa.properties.hibernate.format_sql=true

# Cấu hình "dialect" để Hibernate biết cách giao tiếp với PostgreSQL một cách tối ưu.
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ===================================================================
# FLYWAY DATABASE MIGRATION CONFIGURATION
# ===================================================================
# Bật Flyway để tự động chạy migration scripts khi khởi động ứng dụng.
spring.flyway.enabled=true

# Đường dẫn đến thư mục chứa các file migration.
# Mặc định là classpath:db/migration
spring.flyway.locations=classpath:db/migration

# Tạo schema nếu chưa tồn tại (chỉ trong development).
# Trong production, schema nên được tạo sẵn bởi DBA.
spring.flyway.create-schemas=true

# Allow out-of-order migrations (for fixing migration issues)
spring.flyway.out-of-order=true

# Validate checksum của migration files.
spring.flyway.validate-on-migrate=true

# Tự động tạo baseline khi phát hiện database đã có dữ liệu.
# Điều này cho phép Flyway bắt đầu track migrations trên database hiện có.
spring.flyway.baseline-on-migrate=true

# Phiên bản baseline mặc định (sẽ đánh dấu các migration trước đó là đã chạy).
spring.flyway.baseline-version=0

# ===================================================================
# JWT (JSON WEB TOKEN) SECURITY CONFIGURATION
# ===================================================================
# Đây là "chìa khóa bí mật" để ký (sign) JWT.
# QUAN TRỌNG: Giá trị này phải cực kỳ bí mật và phức tạp. Trong production, hãy dùng biến môi trường.
lexia.jwt.secret=lexia-jwt-secret-key-for-development-change-in-production-2024-very-long-and-secure-key-here

# Thời gian sống của Access Token (tính bằng mili giây).
# Ví dụ: 15 phút = 15 * 60 * 1000 = 900000
# lexia.jwt.access-token-expiration-ms=900000

# Thời gian sống của Refresh Token (tính bằng mili giây).
# Ví dụ: 7 ngày = 7 * 24 * 60 * 60 * 1000 = 604800000
# lexia.jwt.refresh-token-expiration-ms=604800000

# ===================================================================
# EXTERNAL API CONFIGURATION (Google Gemini)
# ===================================================================
# API Key để gọi đến Google Gemini.
# QUAN TRỌNG: Luôn dùng biến môi trường trong production.
gemini.api.key=${GEMINI_API_KEY:}

# URL của Gemini API endpoint (base URL, model will be appended by service)
gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta}

# Default AI model for cost-efficient operations
gemini.model.default=gemini-2.5-flash-lite

# Premium model for complex tasks (role-play scenarios)
gemini.model.premium=gemini-2.5-flash-lite

# Maximum tokens per request (reserve for output)
gemini.max-output-tokens=4000

# Temperature for response creativity (0.0-1.0)
gemini.temperature=0.7

# ===================================================================
# RESILIENCE4J CONFIGURATION (AI API Resilience)
# ===================================================================
# Retry Configuration
resilience4j.retry.instances.geminiApi.max-attempts=1
resilience4j.retry.instances.geminiApi.wait-duration=1s
resilience4j.retry.instances.geminiApi.enable-exponential-backoff=true
resilience4j.retry.instances.geminiApi.exponential-backoff-multiplier=2
resilience4j.retry.instances.geminiApi.retry-exceptions=java.net.SocketTimeoutException,java.io.IOException

# Circuit Breaker Configuration
resilience4j.circuitbreaker.instances.geminiApi.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.geminiApi.slow-call-rate-threshold=50
resilience4j.circuitbreaker.instances.geminiApi.slow-call-duration-threshold=5s
resilience4j.circuitbreaker.instances.geminiApi.wait-duration-in-open-state=60s
resilience4j.circuitbreaker.instances.geminiApi.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.geminiApi.sliding-window-size=10
resilience4j.circuitbreaker.instances.geminiApi.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.geminiApi.sliding-window-type=COUNT_BASED

# Rate Limiter Configuration (per-service level)
resilience4j.ratelimiter.instances.geminiApi.limit-for-period=100
resilience4j.ratelimiter.instances.geminiApi.limit-refresh-period=1m
resilience4j.ratelimiter.instances.geminiApi.timeout-duration=5s

# Time Limiter Configuration
resilience4j.timelimiter.instances.geminiApi.timeout-duration=10s
resilience4j.timelimiter.instances.geminiApi.cancel-running-future=true

# Enable metrics for monitoring (Actuator integration)
resilience4j.circuitbreaker.metrics.enabled=true
resilience4j.ratelimiter.metrics.enabled=true
resilience4j.retry.metrics.enabled=true

# ===================================================================
# FILE UPLOAD CONFIGURATION
# ===================================================================
# Cấu hình giới hạn kích thước file tải lên.
# 50MB để hỗ trợ audio files cho Listening lessons
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=60MB

# Thư mục để lưu file tải lên (trong development).
# Trong production, bạn nên dùng các dịch vụ lưu trữ đám mây như AWS S3.
file.upload-dir=./uploads

# Base URL for file downloads (local development)
file.base-url=http://localhost:8088/api/v1/files

# ===================================================================
# LOGGING CONFIGURATION
# ===================================================================
# Cấu hình cấp độ log cho các package cụ thể.
# Ví dụ: Hiển thị log DEBUG cho package của ứng dụng bạn.
logging.level.com.lingosphere.api=DEBUG
logging.level.com.lexia.backend=DEBUG

# WebSocket debugging logs
logging.level.com.lexia.backend.notification.websocket=DEBUG
logging.level.org.springframework.web.socket=DEBUG
logging.level.org.springframework.messaging=DEBUG

# Hiển thị log WARN cho Hibernate để tránh spam console.
logging.level.org.hibernate=WARN

# Resilience4j logging for retry/circuit breaker tracking
logging.level.io.github.resilience4j.retry=DEBUG
logging.level.io.github.resilience4j.circuitbreaker=DEBUG
logging.level.io.github.resilience4j.ratelimiter=INFO

# ===================================================================
# SWAGGER/OPENAPI CONFIGURATION
# ===================================================================
# Swagger UI path
springdoc.swagger-ui.path=/swagger-ui.html

# OpenAPI JSON/YAML specification path
springdoc.api-docs.path=/api-docs

# Enable Swagger UI
springdoc.swagger-ui.enabled=true

# Sort endpoints by HTTP method
springdoc.swagger-ui.operationsSorter=method

# Sort tags alphabetically
springdoc.swagger-ui.tagsSorter=alpha

# Enable "Try it out" functionality by default
springdoc.swagger-ui.tryItOutEnabled=true

# Display request duration in "Try it out" feature
springdoc.swagger-ui.displayRequestDuration=true

# Packages to scan for API documentation
springdoc.packages-to-scan=com.lexia.backend.controller, com.lexia.backend.auth

# ===================================================================
# WEBSOCKET CONFIGURATION
# ===================================================================
# Comma-separated list of allowed origins for WebSocket connections.
# These origins are allowed to connect to the /ws endpoint.
# In production, add your actual domain(s) and remove localhost entries.
# NOTE: Use "*" for development to allow mobile emulator connections (10.0.2.2)
# For production, explicitly list allowed origins.
lexia.websocket.allowed-origins=*

# ===================================================================
# EMAIL CONFIGURATION
# ===================================================================
# SMTP Configuration (MailHog for local development)
# For production, use real SMTP settings or AWS SES/SendGrid
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# LEXIA Email Service Settings
lexia.email.from-address=noreply@lexia.local
lexia.email.from-name=LEXIA Learning
lexia.email.base-url=http://localhost:3000
lexia.email.logo-url=http://localhost:3000/images/logo.png
lexia.email.tracking-enabled=false
lexia.email.unsubscribe-base-url=http://localhost:3000/unsubscribe
lexia.email.unsubscribe-secret=${LEXIA_UNSUBSCRIBE_SECRET:default-unsubscribe-secret-change-in-production}

# Email Queue Settings
lexia.email.queue.batch-size=10
lexia.email.queue.process-interval=5000
lexia.email.queue.retention-days=30
lexia.email.queue.processing-timeout-minutes=10

# Email Rate Limiting
lexia.email.rate-limit.per-minute=100
lexia.email.rate-limit.per-hour=5000
lexia.email.rate-limit.per-day=50000

# ===================================================================
# ACTUATOR & APPLICATION MONITORING
# ===================================================================
# Expose limited actuator endpoints for monitoring with secure base path.
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info,metrics

# Only show health details to authorized operators (ROLE_ADMIN).
management.endpoint.health.show-details=when_authorized
management.endpoint.health.roles=ROLE_ADMIN
management.endpoint.health.probes.enabled=true

# Ensure commonly used management endpoints remain enabled.
management.endpoint.info.enabled=true
management.endpoint.metrics.enabled=true


# ===================================================================
# STRIPE CONFIGURATION
# ===================================================================
stripe.api-key=${STRIPE_API_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
stripe.price-id.monthly=${STRIPE_PRICE_ID_MONTHLY:}
stripe.price-id.yearly=${STRIPE_PRICE_ID_YEARLY:}

# ===================================================================
# GEMINI IMAGEN CONFIGURATION
# ===================================================================
# Imagen 4 model for flashcard image generation (using :predict endpoint)
gemini.imagen.model=imagen-4.0-fast-generate-001
gemini.imagen.api.url=https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-fast-generate-001:predict
# Flashcard image storage
flashcard.image.upload-dir=./uploads/flashcards
flashcard.image.default-icon=/images/flashcard-default.svg
flashcard.image.width=512
flashcard.image.height=512
