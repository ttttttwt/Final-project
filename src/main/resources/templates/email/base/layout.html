<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" th:fragment="layout (content)">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title th:text="${emailSubject ?: 'LEXIA'}">LEXIA</title>
    <!--[if mso]>
    <noscript>
      <xml>
        <o:OfficeDocumentSettings>
          <o:PixelsPerInch>96</o:PixelsPerInch>
        </o:OfficeDocumentSettings>
      </xml>
    </noscript>
    <![endif]-->
    <style th:inline="text">
      /* Reset and base styles - Matching Admin UI */
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        margin: 0;
        padding: 0;
        background-color: #f4f4f5;
        line-height: 1.6;
        color: #1f2937;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      .wrapper {
        width: 100%;
        padding: 24px 0;
        background-color: #f4f4f5;
      }
      .container {
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        border-radius: 12px;
        overflow: hidden;
        border: 2px dashed #e2e8f0;
      }

      /* Header styles - Matching Admin EmailPreview */
      .header {
        background: #ffffff;
        padding: 24px;
        border-bottom: 1px solid #e2e8f0;
      }
      .header-inner {
        display: flex;
        align-items: center;
      }
      .header-icon {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: rgba(37, 99, 235, 0.1);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-right: 12px;
      }
      .header-icon svg {
        width: 20px;
        height: 20px;
        color: #2563eb;
      }
      .header img {
        height: 40px;
        max-width: 150px;
      }
      .header-text {
        color: #111827;
        font-size: 16px;
        font-weight: 600;
        margin: 0;
      }
      .header-subtext {
        color: #6b7280;
        font-size: 14px;
        margin: 0;
      }

      /* Content styles - Matching Admin preview typography */
      .content {
        padding: 24px;
      }
      .content h1 {
        font-size: 24px;
        font-weight: 700;
        color: #111827;
        margin: 0 0 16px 0;
        line-height: 1.3;
      }
      .content h2 {
        font-size: 18px;
        font-weight: 600;
        color: #374151;
        margin: 20px 0 12px 0;
      }
      .content h3 {
        font-size: 16px;
        font-weight: 600;
        color: #374151;
        margin: 16px 0 8px 0;
      }
      .content p {
        font-size: 15px;
        color: #4b5563;
        margin: 0 0 16px 0;
        line-height: 1.6;
      }

      /* Button styles - Matching Admin primary button */
      .btn-container {
        text-align: center;
        margin: 24px 0;
      }
      .btn {
        display: inline-block;
        padding: 12px 24px;
        background-color: #2563eb;
        color: #ffffff !important;
        text-decoration: none;
        border-radius: 8px;
        font-weight: 500;
        font-size: 15px;
        mso-padding-alt: 0;
      }
      .btn:hover {
        background-color: #1d4ed8;
      }
      .btn-secondary {
        background-color: #f3f4f6;
        color: #374151 !important;
      }
      .btn-secondary:hover {
        background-color: #e5e7eb;
      }

      /* Card styles - Consistent with Admin UI */
      .card {
        background: #f9fafb;
        border-radius: 8px;
        padding: 16px;
        margin: 16px 0;
        border: 1px solid #e5e7eb;
      }
      .card-highlight {
        background: #eff6ff;
        border-color: #bfdbfe;
      }
      .card-success {
        background: #f0fdf4;
        border-color: #bbf7d0;
      }
      .card-warning {
        background: #fffbeb;
        border-color: #fde68a;
      }

      /* Stats grid - For weekly progress and similar */
      .stats-grid {
        display: flex;
        justify-content: space-around;
        gap: 12px;
        margin: 16px 0;
      }
      .stat-item {
        text-align: center;
        flex: 1;
        padding: 12px;
        background: #f9fafb;
        border-radius: 8px;
        border: 1px solid #e5e7eb;
      }
      .stat-value {
        font-size: 24px;
        font-weight: 700;
        color: #2563eb;
      }
      .stat-label {
        font-size: 11px;
        color: #6b7280;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-top: 4px;
      }

      /* Footer styles - Matching Admin preview footer */
      .footer {
        background: #ffffff;
        padding: 16px 24px;
        text-align: center;
        border-top: 1px solid #e2e8f0;
      }
      .footer p {
        font-size: 12px;
        color: #6b7280;
        margin: 4px 0;
      }
      .footer a {
        color: #2563eb;
        text-decoration: none;
      }
      .footer a:hover {
        text-decoration: underline;
      }
      .footer-links {
        margin: 12px 0;
      }
      .footer-links a {
        margin: 0 8px;
        font-size: 12px;
      }
      .social-links {
        margin: 12px 0;
      }
      .social-links a {
        display: inline-block;
        margin: 0 8px;
      }

      /* Helper text */
      .small-text {
        font-size: 13px;
        color: #6b7280;
      }
      .muted {
        color: #9ca3af;
      }
      .link-alt {
        word-break: break-all;
        font-size: 12px;
        color: #6b7280;
      }

      /* Divider - Matching Admin Separator */
      .divider {
        border: none;
        border-top: 1px solid #e5e7eb;
        margin: 20px 0;
      }

      /* Responsive */
      @media only screen and (max-width: 600px) {
        .container {
          margin: 0 12px;
        }
        .content {
          padding: 24px 16px;
        }
        .stats-grid {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <div class="container">
        <!-- Header - Matching Admin EmailPreview -->
        <div class="header">
          <!--[if mso]>
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
            <tr>
              <td style="width: 52px; vertical-align: middle;">
          <![endif]-->
          <table role="presentation" cellspacing="0" cellpadding="0" border="0" style="display: inline-block; vertical-align: middle;">
            <tr>
              <td style="width: 40px; height: 40px; border-radius: 50%; background-color: rgba(37, 99, 235, 0.1); text-align: center; vertical-align: middle;">
                <img th:if="${logoUrl}" th:src="${logoUrl}" alt="LEXIA" style="height: 24px; width: auto;" />
                <span th:unless="${logoUrl}" style="font-size: 18px;">📧</span>
              </td>
            </tr>
          </table>
          <!--[if mso]>
              </td>
              <td style="vertical-align: middle; padding-left: 12px;">
          <![endif]-->
          <span style="display: inline-block; vertical-align: middle; margin-left: 12px;">
            <p class="header-text">LEXIA Platform</p>
            <p class="header-subtext">noreply@lexia-platform.com</p>
          </span>
          <!--[if mso]>
              </td>
            </tr>
          </table>
          <![endif]-->
        </div>

        <!-- Content Block (replaced by child templates) -->
        <div class="content" th:replace="${content}">
          <!-- Child template content will be inserted here -->
        </div>

        <!-- Footer - Matching Admin EmailPreview footer -->
        <div class="footer">
          <p style="margin-bottom: 8px;">
            You're receiving this email because you have an account on LEXIA Platform.
          </p>
          <p>
            <span th:text="#{email.footer.company(${currentYear})}">© 2025 LEXIA Platform. All rights reserved.</span>
          </p>
          
          <div class="footer-links" th:if="${dashboardUrl != null or preferencesUrl != null}">
            <a th:if="${dashboardUrl}" th:href="${dashboardUrl}" th:text="#{email.footer.dashboard}">Dashboard</a>
            <a th:if="${preferencesUrl}" th:href="${preferencesUrl}" th:text="#{email.footer.preferences}">Preferences</a>
          </div>

          <p class="small-text" th:if="${unsubscribeUrl}">
            <span th:text="#{email.footer.unsubscribe.text}">Don't want these emails?</span>
            <a th:href="${unsubscribeUrl}" th:text="#{email.footer.unsubscribe.link}">Unsubscribe</a>
          </p>
        </div>
      </div>
    </div>

    <!-- Tracking pixel (optional) -->
    <img
      th:if="${trackingEnabled and trackingPixelUrl}"
      th:src="${trackingPixelUrl}"
      width="1"
      height="1"
      alt=""
      style="display: none"
    />
  </body>
</html>
